name = "wild-hoggs"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "wild-hoggs-db"
database_id = "1c0e2139-6bec-43b7-9a18-b6ba0b6c97d7"

[[r2_buckets]]
binding = "FILES"
bucket_name = "wild-hoggs-files"

# ── Chat-Hub (WebSocket-Broadcast, Verzeichnis chat-hub/) ────────────────────
#
# ACHTUNG: Diese Datei wird von Cloudflare NICHT gelesen. Pages zieht die
# Konfiguration erst aus einer Wrangler-Datei, wenn `pages_build_output_dir`
# gesetzt ist — hier ist es das nicht, also gilt ausschliesslich das, was im
# Dashboard steht. Die Bindings unten dienen `wrangler pages dev` lokal.
# Aktuellen Ist-Stand jederzeit abrufbar mit:
#     npx wrangler pages download config wild-hoggs
#
# In der PRODUKTION ist entsprechend im Dashboard gesetzt
# (Pages → wild-hoggs → Settings → Bindings bzw. Variables):
#   • Durable Object  CHAT_HUB → ChatRoom aus Worker "wild-hoggs-chat-hub"
#   • Secret          HUB_SECRET   (identisch mit dem Secret des Workers)
#   • Secret          HUB_URL      (Adresse des Workers)
#
# Fehlt davon etwas, läuft die Seite unverändert weiter: /api/chat/ws-ticket
# antwortet mit 503, der Client bleibt beim Polling
# (siehe functions/_lib/chat-hub.ts).
[[durable_objects.bindings]]
name = "CHAT_HUB"
class_name = "ChatRoom"
script_name = "wild-hoggs-chat-hub"
